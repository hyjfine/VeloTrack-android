version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      android-build:
        patterns: ["com.android.*", "org.jetbrains.kotlin.*", "com.google.devtools.ksp"]
      androidx:
        patterns: ["androidx.*"]
      maps-location:
        patterns: ["com.google.android.gms:*", "com.google.maps.android:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
